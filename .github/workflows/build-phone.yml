name: Build Noor TV for phone installation

on:
  push:
    paths:
      - '.github/workflows/build-phone.yml'
      - 'noor-app/**'
      - 'launcher-patch/**'
      - 'themes/riyadh/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch reference launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Gathin23/cleanyourtv
          ref: ddc3b2cdce299a5f30aa2da2437edc40f3cf6f2e
          path: reference
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Apply Noor patch for Riyadh
        run: python3 launcher-patch/apply.py reference 24.7136 46.6753 4 Riyadh
      - name: Build launcher and verify
        working-directory: reference/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Build prayer times
        working-directory: reference/addons/prayer-times
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Build Noor shortcut apps
        working-directory: noor-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Collect installable files
        run: |
          mkdir -p phone-install
          cp reference/launcher/app/build/outputs/apk/release/app-release.apk phone-install/noor-launcher.apk
          cp reference/addons/prayer-times/app/build/outputs/apk/release/app-release.apk phone-install/prayer-times.apk
          for item in kahf baqara sabah masa ruqya; do
            cp "noor-app/app/build/outputs/apk/$item/release/app-$item-release.apk" "phone-install/noor-$item.apk"
          done
          cp -R themes/riyadh phone-install/riyadh
          cp LICENSE phone-install/LICENSE-Noor.txt
          cp reference/LICENSE phone-install/LICENSE-CleanYourTV.txt
          sha256sum phone-install/*.apk > phone-install/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: noor-tv-phone-install
          path: phone-install/
          if-no-files-found: error
          retention-days: 14
